name: Vocle Developer QA Integration
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'tests/developer-workflow/**'
      - 'tests/reporting/**'
      - 'scripts/Test-Vocle.ps1'
      - 'scripts/test_vocle.py'
      - '.github/workflows/vocle-developer-qa.yml'
      - '.github/regression-*.json'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  integration:
    if: github.repository == 'Sriram4747/medcollab-beta-workflows'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Evidence, comparison, ownership and coverage contracts
        run: node --test tests/developer-workflow/workflow.test.mjs tests/developer-workflow/process.test.mjs
      - name: Python disposable-session contracts
        run: python -B -m unittest discover -s tests/developer-workflow -p test_python_launcher.py -v
      - name: Detailed report normalization and escaping contracts
        run: node --test tests/reporting/report.test.mjs tests/reporting/workflow-adapters.test.mjs
      - name: Enforce stable IDs and feature declaration
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: node tests/developer-workflow/coverage-policy.mjs "$BASE_SHA"
      - name: Independently verify candidate tooling with existing offline suites
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: python -B scripts/test_vocle.py --source . --commit "$TARGET_SHA" --profile tooling --output developer-qa-output
      - name: Verify portable Docker orchestration with disposable real backend assertions
        if: runner.os == 'Linux'
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: node tests/developer-workflow/run.mjs --source . --commit "$TARGET_SHA" --profile backend-smoke --output developer-runtime-output
      - name: Preserve submission and QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: developer-qa-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            developer-qa-output/
            developer-runtime-output/
            !developer-runtime-output/backend/mongo-binaries/
          if-no-files-found: error
          retention-days: 90

  visual-report:
    name: Visual QA report
    if: always()
    needs: [integration]
    uses: ./.github/workflows/vocle-reporting.yml
    with:
      workflow_file: vocle-developer-qa.yml
      original_jobs: ${{ toJSON(needs) }}
