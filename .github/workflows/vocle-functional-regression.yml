name: Vocle Functional Regression

on:
  workflow_dispatch:
    inputs:
      force:
        description: Retest even when matching full-backend success exists
        type: boolean
        required: false
        default: false
      scope:
        description: Backend scope; a P0 subset never becomes full success evidence
        type: choice
        options: [backend-all, backend-p0]
        required: true
        default: backend-all
      upstream_sha:
        description: Optional exact 40-character upstream source SHA
        type: string
        required: false
  schedule:
    - cron: '43 2 * * *'
  push:
    branches: [master]
    paths:
      - 'medcollab-backend/**'
      - 'tests/functional-regression/**'
      - 'tests/sanity/**'
      - 'medcollab-app/lib/**'
      - 'medcollab-app/test/**'
      - 'medcollab-app/pubspec.yaml'
      - 'medcollab-app/pubspec.lock'
      - '.github/workflows/vocle-functional-regression.yml'
  pull_request:
    branches: [master]
    paths:
      - 'medcollab-backend/**'
      - 'tests/functional-regression/**'
      - 'tests/sanity/**'
      - 'medcollab-app/lib/**'
      - 'medcollab-app/test/**'
      - 'medcollab-app/pubspec.yaml'
      - 'medcollab-app/pubspec.lock'
      - '.github/workflows/vocle-functional-regression.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: vocle-functional-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'upstream-master' || github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('fork-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detect
    runs-on: ubuntu-24.04
    outputs:
      targetKind: ${{ steps.target.outputs.targetKind }}
      targetSha: ${{ steps.target.outputs.targetSha }}
      scope: ${{ steps.target.outputs.scope }}
      force: ${{ steps.target.outputs.force }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
      affected_modules: ${{ steps.affected.outputs.modules }}
      flutter_changed: ${{ steps.affected.outputs.flutter_changed }}
      needs_run: ${{ steps.history.outputs.needs_run }}
      reason: ${{ steps.history.outputs.reason }}
      baseline_url: ${{ steps.history.outputs.baseline_url }}
    steps:
      - name: Check out exact fork harness revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate catalog and CI contracts
        run: |
          node tests/functional-regression/scripts/validate-catalog.mjs
          node --test tests/functional-regression/scripts/ci-contracts.test.mjs
      - id: target
        name: Resolve exact read-only target
        env:
          VOCLE_INPUT_FORCE: ${{ inputs.force || 'false' }}
          VOCLE_INPUT_SCOPE: ${{ inputs.scope || 'backend-all' }}
          VOCLE_INPUT_UPSTREAM_SHA: ${{ inputs.upstream_sha || '' }}
          VOCLE_PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name || '' }}
          VOCLE_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: node tests/functional-regression/scripts/resolve-target.mjs
      - id: fingerprint
        name: Fingerprint exact harness and assertions
        run: echo "value=$(node tests/functional-regression/scripts/fingerprint.mjs)" >> "$GITHUB_OUTPUT"
      - id: affected
        name: Select affected fork modules with shared-code fallback
        if: steps.target.outputs.targetKind == 'fork-change'
        env:
          VOCLE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: node tests/functional-regression/scripts/affected-modules.mjs
      - id: history
        name: Check validated full-backend success history
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VOCLE_TARGET_SHA: ${{ steps.target.outputs.targetSha }}
          VOCLE_TARGET_KIND: ${{ steps.target.outputs.targetKind }}
          VOCLE_SCOPE: ${{ steps.target.outputs.scope }}
          VOCLE_FORCE: ${{ steps.target.outputs.force }}
          VOCLE_FINGERPRINT: ${{ steps.fingerprint.outputs.value }}
        run: node tests/functional-regression/scripts/find-baseline.mjs

  execute:
    name: Execute
    needs: detect
    if: needs.detect.outputs.needs_run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      result: ${{ steps.report.outputs.result }}
      verified_backend_all: ${{ steps.report.outputs.verified_backend_all }}
      report_ready: ${{ steps.report.outputs.report_ready }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
    steps:
      - name: Check out exact harness revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: harness
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Fetch captured source without credentials
        env:
          TARGET_KIND: ${{ needs.detect.outputs.targetKind }}
          TARGET_SHA: ${{ needs.detect.outputs.targetSha }}
        run: |
          set -euo pipefail
          if [[ "$TARGET_KIND" == upstream-read-only ]]; then repository='mathiharan29/medcollab-beta'; else repository='Sriram4747/medcollab-beta-workflows'; fi
          git init target
          git -C target remote add source "https://github.com/${repository}.git"
          git -C target fetch --depth=1 source "$TARGET_SHA"
          git -C target checkout --detach FETCH_HEAD
          node harness/tests/functional-regression/scripts/verify-target.mjs target "$TARGET_SHA"
      - name: Prepare pinned runtime dependencies and Mongo binary
        env:
          NODE_IMAGE: node:22.20.0-bookworm@sha256:915acd9e9b885ead0c620e27e37c81b74c226e0e1c8177f37a60217b6eabb0d7
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/vocle-functional-output" "$RUNNER_TEMP/vocle-functional-output/runtime"
          docker pull "$NODE_IMAGE"
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache --mount "type=bind,source=$PWD/target,target=/target" --workdir /target/medcollab-backend "$NODE_IMAGE" npm ci --ignore-scripts
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -e npm_config_cache=/tmp/npm-cache --mount "type=bind,source=$PWD/harness,target=/harness" --workdir /harness/tests/sanity "$NODE_IMAGE" npm ci --ignore-scripts
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp --mount "type=bind,source=$PWD/target,target=/target,readonly" --mount "type=bind,source=$PWD/harness,target=/harness,readonly" --mount "type=bind,source=$RUNNER_TEMP/vocle-functional-output,target=/output" "$NODE_IMAGE" node /harness/tests/functional-regression/scripts/prepare-mongo.mjs /target /output
      - name: Run retained sanity and backend modules with loopback-only providers
        env:
          NODE_IMAGE: node:22.20.0-bookworm@sha256:915acd9e9b885ead0c620e27e37c81b74c226e0e1c8177f37a60217b6eabb0d7
          VOCLE_SCOPE: ${{ needs.detect.outputs.scope }}
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --tmpfs /tmp:rw,exec --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD/target,target=/target,readonly" \
            --mount "type=bind,source=$PWD/harness,target=/harness,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/vocle-functional-output,target=/output" \
            -e VOCLE_TARGET_DIR=/target -e VOCLE_OUTPUT_DIR=/output -e VOCLE_SCOPE="$VOCLE_SCOPE" \
            -e VOCLE_AFFECTED_MODULES="${{ needs.detect.outputs.affected_modules }}" \
            -e HOME=/tmp -e TZ=UTC "$NODE_IMAGE" sh -c 'node /harness/tests/functional-regression/scripts/preflight-isolation.mjs && node /harness/tests/functional-regression/scripts/run-backend.mjs'
      - id: report
        name: Verify provenance, cleanup, exact IDs and write reports
        if: always()
        env:
          VOCLE_TARGET_DIR: ${{ github.workspace }}/target
          VOCLE_OUTPUT_DIR: ${{ runner.temp }}/vocle-functional-output
          VOCLE_SCOPE: ${{ needs.detect.outputs.scope }}
          VOCLE_TARGET_KIND: ${{ needs.detect.outputs.targetKind }}
          VOCLE_TARGET_SHA: ${{ needs.detect.outputs.targetSha }}
          VOCLE_HARNESS_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VOCLE_FINGERPRINT: ${{ needs.detect.outputs.fingerprint }}
          VOCLE_AFFECTED_MODULES: ${{ needs.detect.outputs.affected_modules }}
          VOCLE_REQUIRE_PREFLIGHT: 'true'
        run: |
          node harness/tests/functional-regression/scripts/manifest.mjs
          cat "$VOCLE_OUTPUT_DIR/report.md" >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        name: Upload full diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vocle-functional-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/vocle-functional-output/
            !${{ runner.temp }}/vocle-functional-output/mongo-binaries/
          if-no-files-found: error
          retention-days: 90
      - name: Create validated success marker after diagnostic upload
        if: steps.report.outputs.verified_backend_all == 'true' && needs.detect.outputs.targetKind == 'upstream-read-only' && steps.upload.outcome == 'success'
        run: node harness/tests/functional-regression/scripts/write-success-manifest.mjs "$RUNNER_TEMP/vocle-functional-output" '${{ steps.upload.outputs.artifact-digest }}'
      - name: Upload validated full-backend success marker
        if: steps.report.outputs.verified_backend_all == 'true' && needs.detect.outputs.targetKind == 'upstream-read-only' && steps.upload.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vocle-functional-success-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/vocle-functional-output/success-manifest.json
          if-no-files-found: error
          retention-days: 90
      - name: Enforce verified regression gate
        if: always()
        env:
          REPORT_RESULT: ${{ steps.report.outputs.result }}
          ARTIFACT_RESULT: ${{ steps.upload.outcome }}
        run: |
          test "$ARTIFACT_RESULT" = success
          test "$REPORT_RESULT" = PASS

  flutter:
    name: Flutter
    needs: detect
    if: needs.detect.outputs.targetKind == 'fork-change' && needs.detect.outputs.flutter_changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TZ: Asia/Kolkata
      VOCLE_FLUTTER_OUTPUT: ${{ github.workspace }}/vocle-flutter-output
    steps:
      - name: Check out exact fork revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source provenance and prepare report directory
        env:
          TARGET_SHA: ${{ needs.detect.outputs.targetSha }}
        run: |
          set -euo pipefail
          mkdir -p "$VOCLE_FLUTTER_OUTPUT"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          printf '{"targetKind":"fork-change","targetSha":"%s","harnessSha":"%s","timezone":"%s"}\n' "$TARGET_SHA" "$(git rev-parse HEAD)" "$TZ" > "$VOCLE_FLUTTER_OUTPUT/provenance.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Set up pinned Flutter SDK
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true
      - name: Resolve exact locked dependencies
        working-directory: medcollab-app
        run: |
          flutter --version > "$VOCLE_FLUTTER_OUTPUT/sdk.txt"
          flutter pub get --enforce-lockfile
      - id: tests
        name: Run catalog and retained Flutter tests
        working-directory: medcollab-app
        run: |
          set +e
          flutter test --no-pub --reporter json test/functional_regression > "$VOCLE_FLUTTER_OUTPUT/catalog.ndjson" 2> "$VOCLE_FLUTTER_OUTPUT/catalog.stderr.log"
          catalog_exit=$?
          mapfile -t retained < <(find test -maxdepth 1 -name '*_test.dart' -print | sort)
          flutter test --no-pub "${retained[@]}" > "$VOCLE_FLUTTER_OUTPUT/retained.log" 2>&1
          retained_exit=$?
          echo "catalog_exit=$catalog_exit" >> "$GITHUB_OUTPUT"
          echo "retained_exit=$retained_exit" >> "$GITHUB_OUTPUT"
          exit 0
      - id: report
        name: Aggregate exact Flutter catalog and coverage gate
        if: always()
        env:
          CATALOG_EXIT: ${{ steps.tests.outputs.catalog_exit }}
          RETAINED_EXIT: ${{ steps.tests.outputs.retained_exit }}
        run: |
          set -euo pipefail
          if [[ -s "$VOCLE_FLUTTER_OUTPUT/catalog.ndjson" ]]; then
            if ! node tests/functional-regression/scripts/aggregate-flutter.mjs "$VOCLE_FLUTTER_OUTPUT/catalog.ndjson" "$VOCLE_FLUTTER_OUTPUT/report" > "$VOCLE_FLUTTER_OUTPUT/aggregation.log" 2>&1; then
              cat "$VOCLE_FLUTTER_OUTPUT/aggregation.log" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          if [[ ! -s "$VOCLE_FLUTTER_OUTPUT/report.json" ]]; then
            echo '{"tier":"F","result":"ERROR","reason":"Flutter setup, execution or aggregation did not produce a valid report"}' > "$VOCLE_FLUTTER_OUTPUT/report.json"
            echo '# Flutter infrastructure error' > "$VOCLE_FLUTTER_OUTPUT/report.md"
            echo '<testsuite name="Vocle Flutter" tests="1" errors="1"><testcase name="infrastructure"><error message="missing report"/></testcase></testsuite>' > "$VOCLE_FLUTTER_OUTPUT/report.xml"
          fi
          cat "$VOCLE_FLUTTER_OUTPUT/report.md" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require(process.argv[1]); if (!r.complete || r.implementedAndExecuted !== 32) process.exit(1)' "$VOCLE_FLUTTER_OUTPUT/report.json"
          echo "catalog_exit=${CATALOG_EXIT:-missing}; retained_exit=${RETAINED_EXIT:-missing}" >> "$GITHUB_STEP_SUMMARY"
      - id: upload
        name: Upload Flutter reports and provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vocle-flutter-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/vocle-flutter-output/
          if-no-files-found: error
          retention-days: 90
      - name: Enforce Flutter functional gate
        if: always()
        env:
          CATALOG_EXIT: ${{ steps.tests.outputs.catalog_exit }}
          RETAINED_EXIT: ${{ steps.tests.outputs.retained_exit }}
          REPORT_RESULT: ${{ steps.report.outcome }}
          ARTIFACT_RESULT: ${{ steps.upload.outcome }}
        run: |
          test "$REPORT_RESULT" = success
          test "$ARTIFACT_RESULT" = success
          test "$CATALOG_EXIT" = 0
          test "$RETAINED_EXIT" = 0
          node -e 'const r=require(process.argv[1]); if (!r.fullSuccess || !r.complete || r.counts.PASS !== 32) process.exit(1)' "$VOCLE_FLUTTER_OUTPUT/report.json"

  summary:
    name: Summary
    needs: [detect, execute, flutter]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Summarize detection, coverage gate and artifacts
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          EXECUTE_RESULT: ${{ needs.execute.result }}
          NEEDS_RUN: ${{ needs.detect.outputs.needs_run }}
          TARGET_SHA: ${{ needs.detect.outputs.targetSha }}
          TARGET_KIND: ${{ needs.detect.outputs.targetKind }}
          SCOPE: ${{ needs.detect.outputs.scope }}
          REASON: ${{ needs.detect.outputs.reason }}
          BASELINE_URL: ${{ needs.detect.outputs.baseline_url }}
          REPORT_RESULT: ${{ needs.execute.outputs.result }}
          VERIFIED_FULL: ${{ needs.execute.outputs.verified_backend_all }}
          FLUTTER_CHANGED: ${{ needs.detect.outputs.flutter_changed }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
        run: |
          {
            echo '## Vocle Functional Regression'
            echo "- Target: $TARGET_KIND $TARGET_SHA"
            echo "- Scope: $SCOPE"
            echo "- Detection: $DETECT_RESULT; $REASON"
            echo "- Execution: $EXECUTE_RESULT; report $REPORT_RESULT; full-backend success $VERIFIED_FULL"
            echo "- Flutter lane: $FLUTTER_RESULT; relevant client change $FLUTTER_CHANGED"
            if [ -n "$BASELINE_URL" ]; then echo "- Matching evidence: $BASELINE_URL"; fi
            if [ "$NEEDS_RUN" = true ]; then echo "- [Diagnostic artifact](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"; fi
          } >> "$GITHUB_STEP_SUMMARY"
          test "$DETECT_RESULT" = success
          if [ "$NEEDS_RUN" = false ]; then test "$BASELINE_URL" != ''; else test "$EXECUTE_RESULT" = success; fi
          if [ "$FLUTTER_CHANGED" = true ]; then test "$FLUTTER_RESULT" = success; fi
