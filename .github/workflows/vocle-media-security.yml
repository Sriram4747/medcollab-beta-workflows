name: Vocle Offline Media Security

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-media:
    if: github.repository == 'Sriram4747/medcollab-beta-workflows' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: medcollab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: medcollab-backend/package-lock.json
      - name: Install dependencies before isolated execution
        run: npm ci
      - name: Syntax and frozen manifests
        run: |
          for file in scripts/security-media/*.js; do node --check "$file"; done
          node scripts/security-manifest-check.js
          node scripts/security-media/check.js
      - name: Offline isolation and SDK interception self-test
        run: node scripts/security-media/self-test.js
      - name: Author tiny inert MP4 fixture if not already versioned
        run: |
          if [ ! -f scripts/security-media/fixtures/canary.mp4 ]; then
            if ! command -v ffmpeg >/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y -qq ffmpeg
            fi
            mkdir -p scripts/security-media/fixtures
            ffmpeg -hide_banner -loglevel error -f lavfi -i color=c=black:s=16x16:r=1 \
              -frames:v 1 -an -c:v libx264 -pix_fmt yuv420p -map_metadata -1 \
              -fflags +bitexact -flags:v +bitexact -movflags +faststart \
              scripts/security-media/fixtures/canary.mp4
          fi
      - name: Prepare network-none MongoDB and runner images
        run: |
          docker pull mongo:7
          docker pull node:22
          docker run --detach --rm --name vocle-media-mongo --network none \
            --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'" \
            --health-interval 2s --health-timeout 3s --health-retries 20 mongo:7
          for attempt in {1..30}; do
            if [ "$(docker inspect --format='{{.State.Health.Status}}' vocle-media-mongo)" = "healthy" ]; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Execute real backend and SDK contracts without external network
        run: |
          docker run --rm --name vocle-media-runner --network container:vocle-media-mongo \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP,target=/runner-temp" \
            --workdir /workspace/medcollab-backend \
            -e NODE_ENV=test -e API_BASE_URL=http://127.0.0.1:5000 \
            -e MONGODB_URI=mongodb://127.0.0.1:27017/vocle_ci \
            -e JWT_SECRET=ci-test-only-jwt-secret-not-for-production-0000000000000001 \
            -e RUNNER_TEMP=/runner-temp -e VOCLE_MEDIA_NETWORK_NONE=true \
            node:22 node scripts/security-media/run.js
      - name: Preserve sanitized media evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocle-offline-media-security
          path: ${{ runner.temp }}/vocle-media-results/
          if-no-files-found: error
          retention-days: 14
      - name: Stop disposable MongoDB
        if: always()
        run: docker stop vocle-media-mongo || true
