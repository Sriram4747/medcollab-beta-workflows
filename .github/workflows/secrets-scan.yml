name: Secret Scan

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  gitleaks:
    name: Scan for hardcoded secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  visual-report:
    name: Visual QA report
    if: always()
    needs: [gitleaks]
    uses: ./.github/workflows/vocle-reporting.yml
    with:
      workflow_file: secrets-scan.yml
      original_jobs: ${{ toJSON(needs) }}
