# MedCollab GitLab CI — Flutter + backend validation
# https://gitlab.com/mathiharan-project/MedCollab

stages:
  - validate
  - build
  - deploy

variables:
  FLUTTER_IMAGE: ghcr.io/cirruslabs/flutter:3.29.2
  API_BASE_URL: "https://api.example.com"

.flutter_before:
  before_script:
    - cd medcollab-app
    - flutter pub get

flutter:analyze:
  stage: validate
  image: $FLUTTER_IMAGE
  extends: .flutter_before
  script:
    - flutter analyze
    - flutter test

flutter:build-web:
  stage: build
  image: $FLUTTER_IMAGE
  extends: .flutter_before
  script:
    - flutter build web --dart-define=API_BASE_URL=$API_BASE_URL
  artifacts:
    name: medcollab-web-$CI_COMMIT_SHORT_SHA
    paths:
      - medcollab-app/build/web/
    expire_in: 7 days
  rules:
    - if: $CI_COMMIT_BRANCH == "master"

backend:validate:
  stage: validate
  image: node:20-alpine
  script:
    - cd medcollab-backend
    - npm ci
    - node --check src/server.js
    - node --check src/app.js
  cache:
    key: backend-npm-$CI_COMMIT_REF_SLUG
    paths:
      - medcollab-backend/node_modules/

# Mirror to GitHub master → Railway auto-deploys medcollab-backend.
# Requires GitLab CI/CD variable: GITHUB_PUSH_TOKEN (PAT with repo scope on medcollab-beta).
deploy:railway:
  stage: deploy
  image: alpine:3.20
  needs:
    - backend:validate
  before_script:
    - apk add --no-cache git
    - git config user.email "ci@vocle.app"
    - git config user.name "GitLab CI Railway Sync"
    - git remote remove github 2>/dev/null || true
    - git remote add github "https://oauth2:${GITHUB_PUSH_TOKEN}@github.com/mathiharan29/medcollab-beta.git"
  script:
    - echo "Pushing ${CI_COMMIT_BRANCH} -> github/master for Railway"
    - git push github "HEAD:master"
  rules:
    - if: $CI_COMMIT_BRANCH == "design/clinical-design-system"
    - if: $CI_COMMIT_BRANCH == "master"
  allow_failure: false
